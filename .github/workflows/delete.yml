name: Delete All Files Except Workflows
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Delete All Files Except .github
        run: |
          # حذف كل شيء في المجلد الرئيسي باستثناء .github و .git
          shopt -s extglob
          rm -rf !(.github|.git)
          # حذف أي ملفات مخفية في المجلد الرئيسي باستثناء .github و .git
          rm -rf .!(.|git|github)*

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Cleaned repo: deleted all files except workflows" || exit 0
          git push
