name: Unzip Repo File
on:
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  unzip-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip File
        run: |
          # البحث عن ملفات الـ zip وفك ضغطها في الجذر
          for file in *.zip; do
            if [ -f "$file" ]; then
              echo "Extracting: $file"
              unzip -o "$file"
            fi
          done

      - name: Commit and Push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Automated Unzip via GitHub Actions" || exit 0
          git push
