name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Find project folder
        run: |
          ROOT=$(find . -maxdepth 2 -name package.json -not -path '*/node_modules/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2- | xargs dirname)
          echo "ROOT=$ROOT" >> $GITHUB_ENV
          echo "Project folder: $ROOT"
      - name: Install packages
        working-directory: ${{ env.ROOT }}
        run: yarn install
      - name: Build APK
        working-directory: ${{ env.ROOT }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.ROOT }}/android/app/build/outputs/apk/release/*.apk